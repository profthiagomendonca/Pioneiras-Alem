<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Pioneiras & Além</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
#rotate-screen-overlay {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	background: linear-gradient(135deg, #180e22 0%, #0d0814 100%);
	z-index: 100000;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	padding: 24px;
	box-sizing: border-box;
	color: #f7fafc;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

@media screen and (orientation: portrait) {
	#rotate-screen-overlay {
		display: flex !important;
	}
}

.rotate-phone-box {
	width: 80px;
	height: 80px;
	margin-bottom: 20px;
	color: #f6ad55;
	animation: rotateAnim 2.5s ease-in-out infinite;
}

.rotate-phone-svg {
	width: 100%;
	height: 100%;
}

@keyframes rotateAnim {
	0%, 15% {
		transform: rotate(0deg);
	}
	50%, 75% {
		transform: rotate(-90deg);
	}
	90%, 100% {
		transform: rotate(0deg);
	}
}

.rotate-title {
	font-size: 24px;
	font-weight: 700;
	margin: 0 0 12px 0;
	color: #f6ad55;
	text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.rotate-desc {
	font-size: 16px;
	line-height: 1.5;
	color: #e2e8f0;
	max-width: 340px;
	margin: 0 0 24px 0;
}

.rotate-button {
	background: linear-gradient(135deg, #d69e2e 0%, #b7791f 100%);
	color: #1a202c;
	font-weight: bold;
	font-size: 15px;
	padding: 12px 24px;
	border: none;
	border-radius: 8px;
	box-shadow: 0 4px 14px rgba(214, 158, 46, 0.4);
	cursor: pointer;
	transition: transform 0.15s ease, background 0.2s ease;
}

.rotate-button:hover, .rotate-button:active {
	transform: scale(1.04);
	background: #ecc94b;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

			<div class="rotate-phone-box">
				<svg class="rotate-phone-svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
					<rect x="12" y="6" width="24" height="36" rx="4" />
					<circle cx="24" cy="36" r="1.5" fill="currentColor" />
					<path d="M 38 18 C 42 22, 42 28, 38 32" stroke="#f6ad55" stroke-width="2.5" />
					<polyline points="35,16 39,18 41,14" stroke="#f6ad55" stroke-width="2.5" />
				</svg>
			</div>
			<h2 class="rotate-title">Gire seu aparelho</h2>
			<p class="rotate-desc">

			</p>
			<button id="btn-rotate-fullscreen" class="rotate-button" onclick="requestLandscapeMode()">
				Girar e Entrar em Tela Cheia
			</button>
		</div>
		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":36882604,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		
function requestLandscapeMode() {
	var doc = document.documentElement;
	var req = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
	if (req) {
		req.call(doc).then(function() {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function(e) { console.log('Orientation lock not supported:', e); });
			}
		}).catch(function(e) {
			console.log('Fullscreen error:', e);
		});
	} else if (screen.orientation && screen.orientation.lock) {
		screen.orientation.lock('landscape').catch(function(e) { console.log('Orientation lock not supported:', e); });
	}
}
